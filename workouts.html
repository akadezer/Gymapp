<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="workouts.css" />
    <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="sidebar.css" />
    <title>Workouts</title>
  </head>
  <body>
    <div class="sidenav">
      <a href="mainpage.html"
        ><span class="material-symbols-outlined"> home </span></a
      >
      <a href="workouts.html"
        ><span class="material-symbols-outlined"> exercise </span></a
      >
      <a href="history.html"
        ><span class="material-symbols-outlined"> calendar_month </span></a
      >
      <a href="settings.html " id="settings"
        ><span class="material-symbols-outlined"> settings </span></a
      >
    </div>
    <div class="main">
      <h1>Workouts</h1>
      <span class="inline">
        <h2>Create a new workout</h2>
        <button type="button" id="add">new workout</button>
      </span>
      <dialog id="workout">
        <header><h3>New Workout</h3></header>
        <hr />
        <main> 
          <form action="" >
            <div>

              <label for="title">Title:</label>
              <input type="text" name="title" id="title">
            </div>

            <div class="excersice">
              <div>

                <label for="exc">Excersice:</label>
                <input type="text" name="exc" id="exc">
              </div>
              <div class="set">
                
                <p>Set 1:</p>
                <div class="g">

                  <label for="weight">Weight in kg: </label>
                  <input type="number" name="weight" id="weight">
              
                  
                  
                  <label for="reps">Repititions: </label>
                  <input type="number" name="reps" id="reps">
                </div>
              </div>
              <button class="newSet" type="button">new Set</button>
            </div>
            
            <button type="button" id="newExc">new exercise</button>
          </main>
          <hr>
          <footer>
            <button type="button" id="cancel">Cancel</button>
            <button type="button" id="save">Save</button>
          </footer>
        </form>
      </dialog>
      <h2>Recent Workouts</h2>
      <div class="grid">
        <div class="card">
          <h3>Chest</h3>
          <p>15.01.25</p>
          <span class="delete material-symbols-outlined ">
            delete
            </span>
          </div>
        <div class="card">
          <h3>Chest</h3>
          <p>15.01.25</p>
          <span class="delete material-symbols-outlined ">
            delete
            </span>
        </div>
        <div class="card">
          <h3>Chest</h3>
          <p>15.01.25</p>
          <span class="material-symbols-outlined delete">
            delete
            </span>
        </div>
      </div>
    </div>
    <script src="excercise.js"></script>
    <script src="workouts.js"></script>
  </body>
</html>
